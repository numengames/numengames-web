# Despliegue de numen.games a Cloudflare Workers.
#
# POR QUÉ EXISTE. Hasta ahora este repo solo tenía CI (test + build) y el
# despliegue era un `pnpm cf:deploy` manual que se ejecutó una vez, el
# 2026-08-17. Resultado: el sitio reconstruido se fusionó a main y el
# dominio siguió sirviendo el Worker de agosto, sin que nada avisara.
#
# Replica el patrón de numinia.com (numinia-web/.github/workflows/deploy.yml):
# el job `guard` decide SI este commit se publica (CI en verde, no superado
# por un main más nuevo); el job `deploy` publica y luego lo DEMUESTRA — el
# build lleva su SHA en /version.json y el smoke test comprueba que el sitio
# en vivo sirve exactamente ese SHA.
#
# Secretos del repo necesarios: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
# Ningún secreto de build: el formulario de contacto compone un mailto y no
# depende de ningún servicio (Web3Forms retirado el 2026-09-16).
#
# Rollback: panel de Cloudflare → Workers → numengames-web → Deployments →
# Rollback (instantáneo, no requiere este workflow).
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Desplegar aunque el CI de este commit no esté verde (solo emergencias)"
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Un despliegue a la vez. cancel-in-progress: false a propósito — cancelar un
# deploy a medias deja el Worker en un estado que nadie ha verificado.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: ¿Debe publicarse esto?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ship: ${{ steps.decide.outputs.ship }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Decidir
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # Vía automática: si main ya avanzó, no publicar — el CI verde del
          # commit más nuevo lo hará. Evita que un rerun viejo sobrescriba
          # código nuevo.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            tip=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)
            if [ "$tip" != "$sha" ]; then
              echo "::notice::main está en $tip; $sha ha quedado atrás — no se publica (lo hará el CI del nuevo)."
              echo "ship=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ship=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Vía manual: exigir CI verde en el commit, salvo force.
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "::warning::Despliegue FORZADO de $sha — comprobaciones de CI omitidas."
            echo "ship=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --paginate)
          bad=$(echo "$json" | jq '[.check_runs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
          pending=$(echo "$json" | jq '[.check_runs[] | select(.status != "completed")] | length')
          total=$(echo "$json" | jq '.check_runs | length')
          echo "check-runs: $total en total, $pending pendientes, $bad no verdes"
          if [ "$total" -eq 0 ]; then echo "::error::Este commit no tiene resultados de CI — deja que corra, o usa force."; exit 1; fi
          if [ "$pending" -gt 0 ]; then echo "::error::El CI sigue corriendo — espera al verde, o usa force."; exit 1; fi
          if [ "$bad" -gt 0 ]; then echo "::error::El CI está en rojo en este commit — arréglalo, o usa force si de verdad hace falta."; exit 1; fi
          echo "ship=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Construir y desplegar numengames-web
    needs: guard
    if: needs.guard.outputs.ship == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (el SHA exacto que aprobó el guard)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Instalar pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias (reproducible)
        run: pnpm install --frozen-lockfile

      # El CI ya los ha pasado, pero el guard acepta `force` y la vía manual
      # puede saltárselo. Aquí no hay excusa: lo que se publica ha pasado los
      # tests en el mismo runner que lo construye.
      - name: Tests
        run: pnpm test

      - name: Construir el sitio
        run: pnpm build
        env:
          # El sello de /version.json lo lee de aquí (src/pages/version.json.ts).
          WORKERS_CI_COMMIT_SHA: ${{ needs.guard.outputs.sha }}

      # Comprobar el sello ANTES de publicar: si el build no lo incrustó, el
      # smoke test fallaría después del deploy, con el Worker ya sustituido.
      - name: Verificar que el build lleva su identidad
        run: |
          set -e
          test -f dist/version.json || { echo "::error::El build no generó dist/version.json"; exit 1; }
          built=$(jq -r '.commit' dist/version.json)
          if [ "$built" != "${{ needs.guard.outputs.sha }}" ]; then
            echo "::error::dist/version.json dice '$built', se esperaba '${{ needs.guard.outputs.sha }}'"
            exit 1
          fi
          echo "sello correcto: $built"
          # El formulario tiene que salir con clave, no vacío.
          if grep -q 'name="access_key" value=""' dist/es/contacto/index.html; then
            echo "::error::El formulario de contacto se construyó con access_key vacía."
            exit 1
          fi

      - name: Desplegar el Worker (numengames-web, dominio numen.games)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test — el sitio en vivo responde Y es este commit exacto
        run: |
          set -e
          sha="${{ needs.guard.outputs.sha }}"
          # El edge tarda unos segundos en servir la versión nueva en todas partes.
          live=""
          for i in $(seq 1 12); do
            live=$(curl -s --max-time 20 https://numen.games/version.json | jq -r '.commit // empty' 2>/dev/null || true)
            [ "$live" = "$sha" ] && break
            echo "intento $i: en vivo=$live (se espera $sha) — reintento en 5s"
            sleep 5
          done
          if [ "$live" != "$sha" ]; then
            echo "::error::El sitio en vivo sirve '$live', se esperaba '$sha' — el despliegue no ha tomado efecto."
            exit 1
          fi
          echo "versión coincide: $live"

          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://numen.games$1")
            echo "GET $1 -> $code (se espera $2)"
            [ "$code" = "$2" ]
          }
          # Las páginas reconstruidas responden.
          check /es/                 200
          check /en/                 200
          check /es/experiencias/    200
          check /es/como-trabajamos/ 200
          check /es/numen/           200
          check /es/contacto/        200
          # El catálogo retirado redirige, no sirve contenido.
          check /es/pricing          301
          check /es/portfolio        301
          check /es/services/experience 301
          # El 404 es el nuevo, no el del catálogo viejo.
          check /esto-no-existe-nunca 404
          curl -s --max-time 20 https://numen.games/esto-no-existe-nunca | grep -qi "Lost in space" \
            && { echo "::error::Se sigue sirviendo el 404 del catálogo retirado."; exit 1; } || true

          # La raíz redirige por idioma (302, no la vieja "Coming Soon" en 200).
          root_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://numen.games/)
          root_loc=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 https://numen.games/)
          echo "GET / -> $root_code ($root_loc)"
          [ "$root_code" = "302" ] || { echo "::error::La raíz responde $root_code, se esperaba 302 por idioma."; exit 1; }
          en_loc=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 -H 'Accept-Language: en-GB,en;q=0.9' https://numen.games/)
          echo "GET / (Accept-Language: en) -> $en_loc"
          echo "$en_loc" | grep -q '/en/' || { echo "::error::La raíz ignora Accept-Language."; exit 1; }

          # El formulario de contacto tiene clave: sin esto acepta visitas pero
          # rechaza cada envío, que es peor que no tener formulario.
          curl -s --max-time 20 https://numen.games/es/contacto/ | grep -q 'name="access_key" value=""' \
            && { echo "::error::El formulario en vivo tiene access_key vacía."; exit 1; } || true
          echo "formulario de contacto: access_key presente"

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## numen.games — despliegue ${{ job.status }}"
            echo ""
            echo "- Commit: \`${{ needs.guard.outputs.sha }}\`"
            echo "- Disparo: ${{ github.event_name }}"
            echo "- En vivo: https://numen.games · verificar: https://numen.games/version.json"
            echo "- Rollback: panel de Cloudflare → Workers → numengames-web → Deployments → Rollback"
          } >> "$GITHUB_STEP_SUMMARY"
