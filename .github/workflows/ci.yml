name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-008 (STD-015): the workflow token is read-only by default. Write is
# granted per job, to the job that needs it. This one only reads the code.
permissions:
  contents: read

jobs:
  # El nombre de este job ES el contexto del check que exige la protección de
  # rama, y vale `build` en los tres repositorios de la familia
  # (numinia-nwos, numinia-web y este). Un solo valor, regla literalmente
  # idéntica: no tres reglas parecidas con tres nombres distintos.
  #
  # No lo renombres sin cambiar el ruleset a la vez. Un check requerido que
  # ningún workflow produce se queda en `pending` para siempre y bloquea toda
  # fusión aunque el resto esté en verde. Pasó aquí el 2026-09-11: el ruleset
  # pedía `build`, el job se llamaba `test-and-build`, y el repositorio quedó
  # imposible de fusionar hasta detectarlo con una PR de sonda.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Misma versión que usa el deploy (.nvmrc): si CI construye con una
          # versión distinta de la que publica, el verde de CI no prueba que
          # el build de producción funcione.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Un cambio en el sitio tiene que decir qué cambió: cualquier diff bajo
      # src/ necesita entrada (y versión nueva) en src/content/updates.ts.
      # El pie imprime esa versión y enlaza a /updates.
      - name: Versión — el número del pie se mueve con el sitio
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref || 'main' }}"
          node scripts/check-version-bump.mjs --base "origin/${{ github.base_ref || 'main' }}"

      # ARC-001 (STD-015): el pipeline es type-check -> lint -> test -> build.
      # Faltaba el type-check, y no es teórico: el 2026-09-11 una limpieza del
      # diccionario dejó seis referencias a claves inexistentes. `pnpm build`
      # pasó en verde igualmente -- Astro no valida los tipos del contenido al
      # construir -- y la web habría publicado `undefined` en los textos. Lo
      # detectó `astro check` a mano. Si no se ejecuta aquí, no se ejecuta.
      - name: Type-check
        run: pnpm exec astro check

      - name: Run tests
        run: pnpm test

      - name: Build site
        run: pnpm build

      # TRC-007 (STD-015): cada guarda declara qué NO mira, en éxito y en
      # fallo. Un verde aquí no prueba que el sitio publicado sea correcto:
      # prueba que compila, que los tipos cuadran y que los tests pasan.
      - name: Qué no mira esta guarda
        if: always()
        run: |
          echo "Esta guarda NO comprueba:"
          echo "  - que el Worker sirva las rutas (solo wrangler dev lo prueba)"
          echo "  - que la página se vea bien (ningún test mira píxeles)"
          echo "  - que los textos publicados sean ciertos"
          echo "  - que el despliegue llegue a producción (Workers Builds, fuera de este repo; numen.games/version.json lo delata)"
