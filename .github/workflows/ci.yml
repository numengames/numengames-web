#
# This workflow is the repository's feedback loop: it is where a rule stops
# being prose and starts refusing merges. Each step below says what it
# checks and how to fix it when it turns red.
#
# Two kinds of step, told apart by the archive's ENG-067 (STD-005):
#
#   · ARTEFACT steps verify the thing under review — it compiles, the tests
#     pass, the favicon and share card exist, the version moved. They fail
#     the build whatever any standard says, because a page that does not
#     build is broken.
#   · RULE steps verify a practice from STD-015 (code formatted and linted,
#     files that must exist, every file declaring its licence). While that
#     register is `draft` they LOOK BUT DO NOT BITE: they print every
#     finding, in the log and in the job summary, and exit 0. Promoting
#     STD-015 to `active` is what turns them into failures — not an edit
#     here. Lint is the one artefact-shaped step that reports for now: the
#     tree was never formatted, and a gate that is red on day one teaches
#     nothing; it starts biting in the formatting cut.
#
# One required check, literally named `build` (STD-015 § The family
# pipeline): the branch ruleset can only require a check by NAME, so the
# name means the same in every Numen repository. Here the artefact steps
# fit in one job, so that job IS `build`; the rule steps live in their own
# job, which `build` never depends on.
#
# Security (STD-015): third-party actions pinned by commit SHA, never by a
# movable tag (SEC-007); the workflow token is read-only and no job asks for
# more (SEC-008); no secret is read by the build — publication is
# Cloudflare's Workers Builds, connected in its panel, and this repository
# has no build secrets by design (SEC-004).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── ARTEFACT · the required check ──────────────────────────────────────
  # ARC-001 (STD-015): the same pipeline in every repository —
  # type-check → lint → test → build. Red here means the site is broken;
  # the failing step names the file.
  #
  # Do not rename this job without changing the ruleset at the same time.
  # A required check that no workflow produces stays `pending` forever and
  # blocks every merge — it happened here on 2026-09-11: the ruleset asked
  # for `build`, the job was called `test-and-build`, and the repository
  # could not merge until a probe PR found it.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      # Checkout of the PR head, pinned by SHA.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # pnpm, the version package.json pins under `packageManager`.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Node from .nvmrc — the same version Workers Builds uses to publish.
      # If CI built with another version, a green here would prove nothing
      # about the production build.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Dependencies from the lockfile, exactly. Not a check.
      - name: Install
        run: pnpm install --frozen-lockfile

      # `astro check`: a reference to a dictionary key, a prop or a type
      # that does not exist fails here, not in the visitor's browser. Astro
      # does not validate types when it builds — on 2026-09-11 a dictionary
      # clean-up left six references to missing keys, `pnpm build` passed,
      # and the site would have published `undefined`. If this step is not
      # here, nobody runs it.
      - name: Type-check
        run: pnpm run type-check

      # `prettier --check .` then `eslint .` (config: .prettierrc,
      # eslint.config.js — the same shape as nwos-deploy's). REPORTS for
      # now: the tree predates the formatter, so findings go to the job
      # summary as warnings and the step exits 0. Fix a finding with
      # `pnpm run format` (prettier) or in the file eslint names. The step
      # starts to bite in the formatting cut — delete the `continue` block
      # below and let `pnpm run lint` decide.
      - name: Lint (reports until the tree is formatted)
        run: |
          set +e
          out="$(pnpm run lint 2>&1)"; status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "Lint: clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Lint — findings, not blocking until the tree is formatted (STD-015 draft, ENG-067)"
            echo
            echo '```'
            echo "$out" | grep -E '^\[warn\]|error|✖' | head -40
            echo '```'
            echo
            echo 'Fix: `pnpm run format`, then the files eslint names.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::lint found issues — see the job summary; not blocking while the tree is being formatted"
          exit 0

      # vitest over tests/, src/ and scripts/. Includes the contrast check
      # over src/styles/tokens.css (WCAG AA on every text/surface pair the
      # site uses), the legal-corpus pin (the copies match the archive's
      # masters), and the contact form's zero-secret shape. Red means a
      # behaviour changed and its test says so.
      - name: Test
        run: pnpm test

      # A change to the site must say what it changed: any diff under src/
      # needs a new entry (and version) in src/content/updates.ts. The
      # footer prints that version and links to /updates. Same script in
      # every Numen repository; only the path constant differs.
      - name: Version bump
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref || 'main' }}"
          node scripts/check-version-bump.mjs --base "origin/${{ github.base_ref || 'main' }}"

      # scripts/share-card.mjs draws the favicon set and the share card into
      # public/, then `astro build` renders dist/. A page that fails to
      # render fails here. No secrets: WORKERS_CI_COMMIT_SHA is injected by
      # Workers Builds, absent here, so the footer prints `dev` — correct.
      - name: Build
        run: pnpm build

      # DSN-014 (STD-008): a link presents itself. The build above drew the
      # favicon set and the 1200×630 share card into public/; this proves
      # the four files exist and the card has the size link previews need.
      - name: Share card
        run: node scripts/share-card.mjs --check

      # TRC-007 (STD-015): every guard declares what it does NOT look at,
      # on success as on failure. A green here does not prove the published
      # site is right: it proves it compiles, the types agree, the tests
      # pass and the artefacts exist.
      - name: What this guard does not see
        if: always()
        run: |
          echo "This guard does NOT check:"
          echo "  - that the Worker serves the routes (only wrangler dev proves that)"
          echo "  - that the page looks right (no test looks at pixels)"
          echo "  - that the published texts are true"
          echo "  - that the deploy reached production (Workers Builds, outside this repo; numen.games/version.json tells)"

  # ── RULE (looks, does not bite) ────────────────────────────────────────
  # STD-015's repository checklist and ARC-003 (every file declares its
  # licence, REUSE 3.3). Every finding is printed here and in the job
  # summary; the job exits 0 while STD-015 is `draft` (ENG-067). Fix a
  # finding by adding the file or the declaration — never by editing the
  # list to match the tree.
  checklist:
    name: Repository checklist (reports, does not block)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The files every Numen repository carries (STD-015 § What a
      # repository born from the mould ships with), and the pointer at the
      # archive's AGENTS.md that CLAUDE.md must open with.
      - name: Files the standards require, and the CLAUDE.md pointer
        run: |
          findings=()
          for f in README.md CLAUDE.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
                   CHANGELOG.md TRADEMARKS.md LICENSE REUSE.toml \
                   .editorconfig .env.example \
                   .github/CODEOWNERS .github/dependabot.yml; do
            [ -f "$f" ] || findings+=("missing file: $f — required by the repository checklist (STD-015)")
          done
          # GitHub accepts either case for the PR template; the checklist accepts both.
          [ -f .github/PULL_REQUEST_TEMPLATE.md ] || [ -f .github/pull_request_template.md ] \
            || findings+=("missing file: .github/PULL_REQUEST_TEMPLATE.md")
          [ -d LICENSES ] || findings+=("missing directory: LICENSES/ — REUSE needs the text of every licence REUSE.toml names")
          grep -qE "numinia-archive|numinia-nwos" CLAUDE.md \
            || findings+=("CLAUDE.md does not point at the archive (numinia-archive — the rules live there)")

          if [ "${#findings[@]}" -eq 0 ]; then
            echo "Repository checklist: every required file is present."
            echo "Repository checklist: clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Findings are warnings, not errors: STD-015 is draft, so this
          # guard looks but does not bite (ENG-067).
          {
            echo "### Repository checklist — ${#findings[@]} finding(s), not blocking while STD-015 is draft"
            echo
            for x in "${findings[@]}"; do echo "- $x"; done
          } >> "$GITHUB_STEP_SUMMARY"
          for x in "${findings[@]}"; do echo "::warning::$x"; done
          exit 0

      # ARC-003 (STD-015): REUSE 3.3 — every file names its licence, in a
      # header or through REUSE.toml, and LICENSES/ holds every licence
      # text named. Pinned version, the one the other repositories run.
      # Reports: the verdict goes to the job summary and the step exits 0.
      - name: REUSE lint (every file declares its licence)
        run: |
          pipx install reuse==6.2.0
          set +e
          out="$(reuse lint 2>&1)"; status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "REUSE lint: compliant." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### REUSE lint — not compliant, not blocking while STD-015 is draft (ENG-067)"
            echo
            echo '```'
            echo "$out" | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::reuse lint is not compliant — see the job summary"
          exit 0

      # TRC-007 (STD-015): what the checklist does not see.
      - name: What this guard does not see
        if: always()
        run: |
          echo "This guard does NOT check:"
          echo "  - whether the files say anything true (only that they exist)"
          echo "  - whether a declared licence is the RIGHT licence for the content (REUSE checks consistency, not legal fit)"
          echo "  - the LICENSE ↔ REUSE.toml discrepancy (GPL-3.0 file, AGPL-3.0-only map): an Oracle ruling, not a script"
