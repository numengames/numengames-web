# ARC-01: the same pipeline in every repo — type-check → lint → test → build.
# SEC-07: third-party actions pinned by commit SHA, never by tag.
# SEC-08: workflow tokens are read-only by default.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: type-check → lint → test → build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  presence:
    name: Repository checklist (§3.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Every file the standards require is present
        run: |
          missing=0
          for f in CLAUDE.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
                   TODO.md .editorconfig .env.example \
                   .github/CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md \
                   .github/dependabot.yml .github/ISSUE_TEMPLATE/bug_report.yml; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing — required by engineering-standards §4"
              missing=1
            fi
          done
          exit $missing

      - name: CLAUDE.md carries the agent contract
        run: |
          grep -q "audit the current branch state" CLAUDE.md \
            || { echo "::error::CLAUDE.md must open with the AGT-01 audit instruction"; exit 1; }
          grep -q "Sistema de Diseño" CLAUDE.md \
            || { echo "::error::CLAUDE.md must point at the Design System (§0.3)"; exit 1; }
