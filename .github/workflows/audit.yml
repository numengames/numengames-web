#
# Dependency audit: the production dependencies against the advisory
# database, high and above. Seen, not enforced. The job lives once, in
# numengames/.github.
name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    uses: numengames/.github/.github/workflows/audit.yml@3d2cca44cebc8ef7420f1bee3451d7227d55d8ce
    permissions:
      contents: read
    with:
      package-manager: pnpm
      working-directory: .
      node-version-file: .nvmrc
