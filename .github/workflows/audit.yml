#
# Dependency audit (STD-015, CI parity 2026-10-07): the production
# dependencies in pnpm-lock.yaml checked against the advisory database,
# high severity and above. Development tooling is left out (`--prod`): it
# never reaches the visitor.
#
# Seen, not enforced (ENG-067, STD-015 draft): advisories go to the log and
# the job summary and the job stays green. Dependabot raises the fixes; this
# shows what is still open. On 2026-10-07 the audit reported 10 high (and
# 2 moderate) advisories, all transitive through astro / vite / svelte
# tooling — none in a package this repository names directly.
name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "10 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # Node from .nvmrc; corepack (bundled with it) runs the pnpm that
      # package.json pins under `packageManager`. `pnpm audit` reads the
      # lockfile, so no install is needed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: pnpm audit --prod (reports, does not block)
        continue-on-error: true
        run: |
          set +e
          out="$(corepack pnpm audit --prod --audit-level high 2>&1)"; status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "pnpm audit (prod, high+): clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### pnpm audit (prod, high+) — advisories, seen not enforced (STD-015 draft, ENG-067)"
            echo
            echo '```'
            echo "$out" | grep -E '^│ (high|critical|moderate|Package|Patched|More info)' | head -80
            echo "$out" | tail -2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::pnpm audit found advisories — see the job summary; not blocking"
          exit "$status"
