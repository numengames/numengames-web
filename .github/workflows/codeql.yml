#
# Code scanning (STD-015, CI parity 2026-10-07): CodeQL reads the
# JavaScript and TypeScript of the site, the Worker and the scripts, without
# building them (`build-mode: none`), and files what it finds under the
# repository's Security → Code scanning tab. Seen, not enforced: this is a
# separate workflow, not part of the required `build` check; an alert is a
# finding to read, not a red merge.
#
# Actions pinned by commit SHA (SEC-007); the workflow token reads only and
# the one job gets `security-events: write` to upload its results (SEC-008).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
