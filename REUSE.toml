version = 1

# REUSE 3.3 licence map for numengames-web (ARC-003 of STD-015).
#
# Regimes follow LIC-002 of STD-010: a deployable application is
# AGPL-3.0-only, public assets and design are CC0-1.0, documentation is
# CC-BY-4.0. This repository builds and serves numen.games, so the code
# regime is AGPL — not the GPL-3.0 the root LICENSE file currently carries;
# that discrepancy awaits an Oracle ruling. This file declares what the
# standard prescribes.
#
# Ordering matters: when several annotations match a file, the LAST one
# wins. Specific overrides therefore come after their directory.

# --- The application: code that decides what is served ----------------------
[[annotations]]
path = [
  "src/**",
  "worker/**",
  "scripts/**",
  "tests/**",
  "astro.config.mjs",
  "vitest.config.ts",
  "wrangler.jsonc",
  "package.json",
  "tsconfig.json",
  "tailwind.config.*",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Numen Games"
SPDX-License-Identifier = "AGPL-3.0-only"

# --- CI and repository configuration ---------------------------------------
# MIT per LIC-002: CI is tooling, not the deciding application.
[[annotations]]
path = [
  ".github/**",
  ".editorconfig",
  ".nvmrc",
  ".gitignore",
  "pnpm-lock.yaml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Numen Games"
SPDX-License-Identifier = "MIT"

# --- Documentation ----------------------------------------------------------
[[annotations]]
path = [
  "README.md",
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CHANGELOG.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Numen Games"
SPDX-License-Identifier = "CC-BY-4.0"

# --- Published assets -------------------------------------------------------
# Photographs and renders of experiences delivered for real events. Published
# under CC0 per LIC-002 ("public assets, data, design").
#
# LIC-001 applies: ownership must be demonstrable. These images come from
# environments built by Numen Games for the events named in the home page.
# The Nerdearla image shows a venue co-branded with Arcasiles, the event
# organiser — if that co-authorship is not covered by the engagement, this
# annotation is wrong and the file must move to the reserved regime.
[[annotations]]
path = [
  "public/proyectos/**",
  "public/opengraph.jpg",
  "public/favicon.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Numen Games"
SPDX-License-Identifier = "CC0-1.0"

# --- Brand ------------------------------------------------------------------
# Lore, brand and identity are reserved (LIC-002, fourth regime): the wordmark
# is not CC0 and must not be reused outside this site.
[[annotations]]
path = ["public/assets/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Numen Games"
SPDX-License-Identifier = "LicenseRef-Numen-Reserved"

# --- Legal corpus ------------------------------------------------------------
# src/content/legal/*.md are verbatim copies of the numinia-archive masters
# (legal/LEG-001..004). Each file declares its own licence in an SPDX
# comment (LicenseRef-Numen-AllRightsReserved, 2026 Numen Games S.L.) — per
# file, never per folder. The folder override that stood here named another
# identifier and would have beaten the files' own declaration, so it is gone.
# Refresh by copying; never edit here.

# --- Brand (source copy) ----------------------------------------------------
# The scarab the footer closes with, copied from numinia-web
# (packages/ui/src/assets/brand). Same regime as public/assets/**.
[[annotations]]
path = ["src/assets/brand/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Numen Games"
SPDX-License-Identifier = "LicenseRef-Numen-Reserved"

# --- Icons (Phosphor, vendored) ---------------------------------------------
# The day-and-night switch icons, copied from the house subset (numinia-archive
# web/src/icons). Phosphor is MIT.
[[annotations]]
path = ["src/assets/icons/moon-stars.svg", "src/assets/icons/sun.svg"]
precedence = "override"
SPDX-FileCopyrightText = "Phosphor Icons (https://phosphoricons.com)"
SPDX-License-Identifier = "MIT"
