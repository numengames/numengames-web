version = 1

# REUSE 3.3 licence map for numengames-web (ARC-003 of STD-015).
#
# Regimes follow LIC-002 of STD-010 (public assets and design are CC0-1.0,
# documentation is CC-BY-4.0, brand is reserved) with ONE exception decided
# by Pablo: the code of this repository is GPL-3.0-only, not the
# AGPL-3.0-only that LIC-002 prescribes for a deployable application. The
# root LICENSE file carries the GPL-3.0 text and this file agrees with it.
# "Only", not "or later": nothing here grants later versions.
#
# One reserved identifier: LicenseRef-Numen-AllRightsReserved (the name
# numinia-archive uses); its text is in LICENSES/.
#
# Ordering matters: when several annotations match a file, the LAST one
# wins. Specific overrides therefore come after their directory.

# --- The application: code that decides what is served ----------------------
[[annotations]]
path = [
  "src/**",
  "worker/**",
  "scripts/**",
  "tests/**",
  "astro.config.mjs",
  "vitest.config.ts",
  "wrangler.jsonc",
  "package.json",
  "tsconfig.json",
  "tailwind.config.*",
  "postcss.config.cjs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "GPL-3.0-only"

# --- CI and repository configuration ---------------------------------------
# MIT per LIC-002: CI is tooling, not the deciding application.
[[annotations]]
path = [
  ".github/**",
  ".editorconfig",
  ".nvmrc",
  ".npmrc",
  ".prettierrc",
  ".env.example",
  ".vscode/**",
  ".gitignore",
  "pnpm-lock.yaml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "MIT"

# --- Documentation ----------------------------------------------------------
[[annotations]]
path = [
  "README.md",
  "AGENTS.md",
  "CLAUDE.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CHANGELOG.md",
  "TRADEMARKS.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC-BY-4.0"

# --- Published assets -------------------------------------------------------
# Photographs and renders of experiences delivered for real events. Published
# under CC0 per LIC-002 ("public assets, data, design").
#
# LIC-001 applies: ownership must be demonstrable. These images come from
# environments built by Numen Games for the events named in the home page.
# The Nerdearla image shows a venue co-branded with Arcasiles, the event
# organiser — if that co-authorship is not covered by the engagement, this
# annotation is wrong and the file must move to the reserved regime.
[[annotations]]
path = [
  "public/proyectos/**",
  "public/.well-known/**",
  "public/opengraph.jpg",
  "public/favicon.png",
  "public/robots.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# --- Brand ------------------------------------------------------------------
# Lore, brand and identity are reserved (LIC-002, fourth regime): the wordmark
# is not CC0 and must not be reused outside this site.
[[annotations]]
path = ["public/assets/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# --- Third-party mark --------------------------------------------------------
# ENISA's seal for companies it financed before 2025 ("Sello horizontal",
# enisa.es/centro-de-ayuda/recursos-graficos), resized to 720 px, the same
# file numinia.org shows. It is ENISA's mark, shown as ENISA offers it; no
# licence in this repository extends to it (numinia-archive OPS-017).
[[annotations]]
path = ["public/partners/enisa-financiada-por.png"]
precedence = "override"
SPDX-FileCopyrightText = "Empresa Nacional de Innovación, S.M.E., S.A. (ENISA)"
SPDX-License-Identifier = "LicenseRef-Third-Party-Mark"

# --- Legal corpus ------------------------------------------------------------
# src/content/legal/*.md are verbatim copies of the numinia-archive masters
# (legal/LEG-001..004). Each file declares its own licence in an SPDX
# comment (LicenseRef-Numen-AllRightsReserved, 2026 Numen Games S.L.). This
# annotation names the four files one by one, with the same identifier, only
# so the aggregate `src/**` block above does not add GPL to them. Refresh by copying; never edit here.
[[annotations]]
path = [
  "src/content/legal/notice.md",
  "src/content/legal/privacy.md",
  "src/content/legal/cookies.md",
  "src/content/legal/terms.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# --- Brand (source copy) ----------------------------------------------------
# The scarab the footer closes with, copied from numinia-web
# (packages/ui/src/assets/brand). Same regime as public/assets/**.
[[annotations]]
path = ["src/assets/brand/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# --- The wordmark in the bar ------------------------------------------------
# Numen_Games_Horizontal_Word.svg, the canonical file copied from
# numinia-archive web/src/brand, under the identifier it carries there: the
# brand mark is never licensed.
[[annotations]]
path = ["src/assets/brand/Numen_Games_Horizontal_Word.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# --- Icons (Phosphor, vendored) ---------------------------------------------
# The bar's icons (entries, menu, day-and-night switch), copied from the house
# subset (numinia-archive web/src/icons). Phosphor is MIT.
[[annotations]]
path = [
  "src/assets/icons/moon-stars.svg",
  "src/assets/icons/sun.svg",
  "src/assets/icons/house.svg",
  "src/assets/icons/confetti.svg",
  "src/assets/icons/coffee.svg",
  "src/assets/icons/skull.svg",
  "src/assets/icons/clipboard-text.svg",
  "src/assets/icons/users.svg",
  "src/assets/icons/note-pencil.svg",
  "src/assets/icons/list.svg",
  "src/assets/icons/x.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "Phosphor Icons (https://phosphoricons.com)"
SPDX-License-Identifier = "MIT"
